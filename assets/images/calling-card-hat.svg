<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <!-- Filter for bold comic stroke -->
    <filter id="white-outline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology in="SourceAlpha" result="DILATED" operator="dilate" radius="5"/>
      <feFlood flood-color="#ffffff" result="WHITE"/>
      <feComposite in="WHITE" in2="DILATED" operator="in" result="OUTLINE"/>
      <feMerge>
        <feMergeNode in="OUTLINE"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(20, 10)">
    <!-- Back Red/Black Flames -->
    <path d="M 230,170 C 270,140 290,110 270,70 C 255,100 240,115 220,120 C 240,90 240,60 215,30 C 205,65 190,85 170,100 C 180,75 175,50 155,25 C 150,60 130,90 100,110 C 120,80 115,55 95,40 C 85,80 70,110 50,135 C 75,120 105,125 120,145 C 90,145 75,160 65,185 C 90,175 120,185 135,210 Z" fill="#e60012" stroke="#000000" stroke-width="4"/>

    <path d="M 220,165 C 250,140 265,115 250,85 C 240,105 225,115 210,120 C 225,95 220,75 205,50 C 195,75 180,90 165,105 C 170,85 165,65 150,45 C 145,70 130,95 110,115 C 120,95 115,75 100,60 C 95,90 80,115 65,135 Z" fill="#ffffff" opacity="0.95" stroke="#000000" stroke-width="3"/>

    <!-- Main Phantom Thief Top Hat (Tilted, Red with Black Trim) -->
    <!-- Crown -->
    <path d="M 125,75 L 235,55 C 245,95 250,145 220,175 L 115,185 C 105,150 110,105 125,75 Z" fill="#e60012" stroke="#000000" stroke-width="6"/>

    <!-- Hat Inner Shadow / Comic Hatching -->
    <path d="M 140,80 L 165,75 C 160,110 155,145 135,180 L 115,185 C 125,150 130,115 140,80 Z" fill="#99000b"/>
    <polygon points="190,65 215,60 205,178 185,179" fill="#000000" opacity="0.85"/>

    <!-- Hat Crease and Highlights -->
    <path d="M 160,65 Q 185,115 170,165" stroke="#ffffff" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M 215,70 Q 230,115 215,160" stroke="#ffffff" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Hat Ribbon / Band -->
    <path d="M 112,170 Q 165,160 223,152 L 221,176 Q 165,184 114,192 Z" fill="#000000"/>

    <!-- Hat Brim (Curved Persona 5 Style) -->
    <path d="M 75,195 C 110,180 180,165 255,160 C 275,158 290,168 280,182 C 245,210 160,225 80,218 C 65,216 65,200 75,195 Z" fill="#000000" stroke="#ffffff" stroke-width="4"/>
    <path d="M 85,200 C 120,187 185,175 255,170 C 265,169 270,174 265,180 C 235,198 165,210 95,206 Z" fill="#e60012"/>

    <!-- Phantom Thief White Masquerade Mask on Brim -->
    <path d="M 130,185 C 165,170 215,165 250,175 C 265,180 270,195 255,208 C 225,230 165,235 125,215 C 115,205 118,190 130,185 Z" fill="#ffffff" stroke="#000000" stroke-width="4"/>
    
    <!-- Mask Wing Points -->
    <polygon points="120,190 95,175 130,200" fill="#ffffff" stroke="#000000" stroke-width="3"/>
    <polygon points="255,180 280,165 248,195" fill="#ffffff" stroke="#000000" stroke-width="3"/>

    <!-- Mask Eye Cutouts -->
    <polygon points="145,193 175,193 165,206 142,204" fill="#000000"/>
    <polygon points="235,190 205,191 212,204 238,201" fill="#000000"/>
    <!-- Red glint in eye -->
    <circle cx="158" cy="198" r="3" fill="#e60012"/>
    <circle cx="222" cy="197" r="3" fill="#e60012"/>

    <!-- Small Splatters and Dots -->
    <circle cx="50" cy="90" r="4" fill="#000000"/>
    <circle cx="45" cy="105" r="2.5" fill="#000000"/>
    <circle cx="60" cy="115" r="3" fill="#000000"/>
    <circle cx="280" cy="110" r="3.5" fill="#000000"/>
    <circle cx="295" cy="125" r="2" fill="#000000"/>
    <circle cx="275" cy="135" r="4" fill="#000000"/>
  </g>

  <!-- "TAKE YOUR HEART" Typography Banner (Cutout Comic Style) -->
  <g transform="translate(200, 260)">
    <!-- White backing outline badge -->
    <path d="M -165,-22 L 165,-22 L 175,18 L -155,18 Z" fill="#ffffff" stroke="#000000" stroke-width="6"/>
    <!-- Black text with custom Persona 5 font styling -->
    <text x="0" y="7" font-family="'Anton', Impact, sans-serif" font-size="34" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="3">
      TAKE YOUR HEART
    </text>
  </g>
</svg>
